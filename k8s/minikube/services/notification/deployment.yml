apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification
  labels:
    app: notification
spec:
  replicas: 1
  template:
    metadata:
      name: notification
      labels:
        app: notification
    spec:
      containers:
        - name: notification
          image: ayeshawaheed7/customer-management-notification-service:0f4f7cab6795b4cf3e135b3cf14ce5b11d60550d
          imagePullPolicy: Always
          ports:
            - containerPort: 9095
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: kube
      restartPolicy: Always
  selector:
    matchLabels:
      app: notification