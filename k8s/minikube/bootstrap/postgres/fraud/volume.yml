apiVersion: v1
kind: PersistentVolume
metadata:
  name: postgres-fraud-pv
  labels:
    type: local
    app: postgres-fraud
spec:
  storageClassName: manual
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  hostPath:
    path: /mnt/data/postgres-fraud
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-fraud-pvc
  labels:
    app: postgres-fraud
spec:
  storageClassName: manual
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
