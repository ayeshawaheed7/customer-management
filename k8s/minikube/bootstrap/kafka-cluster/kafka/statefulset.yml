apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels:
    app: kafka
spec:
  serviceName: kafka
  replicas: 2
  template:
    metadata:
      name: kafka
      labels:
        app: kafka
    spec:
      volumes:
        - name: kafka
          persistentVolumeClaim:
            claimName: kafka-pvc
      containers:
        - name: kafka
          image: confluentinc/cp-kafka:latest
          ports:
            - containerPort: 9092
          imagePullPolicy: IfNotPresent
          volumeMounts:
            - mountPath: "/var/lib/kafka/data"
              name: kafka
          envFrom:
            - configMapRef:
                name: kafka-config
  selector:
    matchLabels:
      app: kafka