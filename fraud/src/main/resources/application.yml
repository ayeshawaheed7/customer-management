server:
  port: 9091

spring:
  application:
    name: fraud
  datasource:
    url: jdbc:postgresql://postgres-fraud:5433/fraud
    username: ayeshascode
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
    fetch-registry: true
    register-with-eureka: true

otel:
  exporter:
    otlp:
      endpoint: http://otel-collector:4318
