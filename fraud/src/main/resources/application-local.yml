server:
  port: 9091

spring:
  application:
    name: fraud
  datasource:
    url: jdbc:postgresql://localhost:5433/fraud
    username: ayeshascode
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    fetch-registry: true
    register-with-eureka: true

otel:
  exporter:
    otlp:
      endpoint: http://localhost:4318
  service:
    name: fraud-service  # Sets the service name for OpenTelemetry

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
