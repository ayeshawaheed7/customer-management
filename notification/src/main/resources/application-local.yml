server:
  port: 9092

spring:
  application:
    name: notification
  datasource:
    url: jdbc:postgresql://localhost:5434/notification
    username: ayeshascode
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: localhost:29092
    security-protocol: PLAINTEXT
    consumer:
      notification-updates:
        offset: earliest

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

otel:
  service:
    name: notification-service
  exporter:
    otlp:
      endpoint: http://localhost:4318
      protocol: http/protobuf