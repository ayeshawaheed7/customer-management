server:
  port: 9095

spring:
  application:
    name: notification
  datasource:
    url: ${POSTGRESQL_DB_URL}
    username: ${POSTGRESQL_DB_USERNAME}
    password: ${POSTGRESQL_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS_URL}
    security-protocol: ${KAFKA_BOOTSTRAP_SERVERS_SECURITY_PROTOCOL}
    consumer:
      notification-updates:
        offset: earliest