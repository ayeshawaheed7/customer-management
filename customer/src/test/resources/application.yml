server:
  port: 9090

spring:
  application:
    name: customer
  datasource:
    url: ${POSTGRESQL_DB_URL}
    username: ${POSTGRESQL_DB_USERNAME}
    password: ${POSTGRESQL_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS_URL}
    security-protocol: ${KAFKA_BOOTSTRAP_SERVERS_SECURITY_PROTOCOL}

# Use when doing communication with RestTemplate
fraud-service:
#  url: http://localhost:9091      #  for local development
  url: http://FRAUD                # when service is registered with Eureka

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICE_URL_DEFAULT_ZONE}
    fetch-registry: true
    register-with-eureka: true

