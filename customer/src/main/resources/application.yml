server:
  port: 9090

spring:
  application:
    name: customer
  datasource:
    url: jdbc:postgresql://postgres-customer:5432/customer
    username: ayeshascode
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  kafka:
    bootstrap-servers: kafka:9092
    security-protocol: PLAINTEXT

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
    fetch-registry: true
    register-with-eureka: true

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0

otel:
  service:
    name: customer-service
  exporter:
    otlp:
      endpoint: http://otel-collector:4318
