server:
  port: 9090

spring:
  application:
    name: customer
  datasource:
    url: jdbc:postgresql://postgres-customer:5432/customer
    username: ayeshascode
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  rabbitmq:
    addresses: rabbitmq:5672

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka
    fetch-registry: true
    register-with-eureka: true

otel:
  exporter:
    otlp:
      endpoint: http://otel-collector:4318
