name: Build and Publish API Gateway Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'apigateway/**'
  pull_request:
    paths:
      - 'apigateway/**'

jobs:
  build_apigateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: '3.8.6'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -X --batch-mode --update-snapshots clean verify -f apigateway/pom.xml

      - name: Packaging API Gateway data as artifacts
        uses: actions/upload-artifact@v2
        with:
          name: apigateway-jar
          path: apigateway/target/*.jar
          retention-days: 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push API Gateway Docker image
        id: push_apigateway
        uses: docker/build-push-action@v5
        with:
          context: apigateway
          file: apigateway/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/customer-management-apigateway:${{ github.sha }}
