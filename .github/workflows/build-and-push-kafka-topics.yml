name: Build and Publish Kafka Topics Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'kafka-topics/**'
  pull_request:
    paths:
      - 'kafka-topics/**'

jobs:
  build_kafka_topics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: '3.8.6'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -X --batch-mode --update-snapshots clean verify -f kafka-topics/pom.xml

      - name: Packaging Kafka Topics data as artifacts
        uses: actions/upload-artifact@v2
        with:
          name: kafka-topics-jar
          path: kafka-topics/target/*.jar
          retention-days: 1

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Kafka Topics Docker image
        id: push_kafka_topics
        uses: docker/build-push-action@v5
        with:
          context: kafka-topics
          file: kafka-topics/Dockerfile
          push: true
          platforms: linux/arm64
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/customer-management-kafka-topics:${{ github.sha }}
