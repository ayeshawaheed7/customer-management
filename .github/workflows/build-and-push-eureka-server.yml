name: Build and Publish Eureka Server Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'eureka-server/**'
  pull_request:
    paths:
      - 'eureka-server/**'

jobs:
  build_eureka_server:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven
        uses: stCarolas/setup-maven@v4.5
        with:
          maven-version: '3.8.6'

      - name: Cache Maven packages
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn -X --batch-mode --update-snapshots clean verify -f eureka-server/pom.xml

      - name: Packaging Eureka Server data as artifacts
        uses: actions/upload-artifact@v2
        with:
          name: eureka-server-jar
          path: eureka-server/target/*.jar
          retention-days: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and push Eureka Server Docker image
        uses: docker/build-push-action@v5
        with:
          context: eureka-server
          file: eureka-server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/eureka-server:${{ github.sha }}